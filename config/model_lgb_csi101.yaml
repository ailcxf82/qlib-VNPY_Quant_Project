model:
  loss: "mse"
  num_boost_round: 1200
  early_stopping_rounds: 60

  params:
    objective: "huber"
    boosting_type: "gbdt"
    learning_rate: 0.03
    max_depth: 5
    num_leaves: 25
    feature_fraction: 0.65
    bagging_fraction: 0.65
    bagging_freq: 1
    lambda_l1: 0.4
    lambda_l2: 2.0
    min_data_in_leaf: 30
    verbosity: -1
    device: "gpu"
    gpu_platform_id: 0
    gpu_device_id: 0
