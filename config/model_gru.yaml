model:
  # ==================== 序列配置 ====================
  # 序列长度：GRU输入的时间步长
  # - 较长(40-60)：能捕获更长期的历史依赖，但训练慢
  # - 较短(5-20)：训练快，适合捕获短期模式
  # - 当前值5：轻量级，适合快速迭代
  seq_len: 20

  # ==================== 网络结构 ====================
  # 隐藏层大小：控制模型容量和表达能力
  # - 较大值(64-256)：更强的非线性拟合能力，但容易过拟合，训练慢
  # - 较小值(16-32)：泛化能力强，训练快，适合小数据集
  # - 当前值32：调参实验1-1
  hidden_size: 64

  # GRU层数：控制网络深度
  # - 2-3层：能学习更复杂的时序模式，但梯度问题风险增加
  # - 1层：简单有效，梯度传播稳定，适合大多数场景
  # - 当前值1：调参实验1-1
  num_layers: 1

  # ==================== 注意力机制 ====================
  # 注意力类型：增强时序建模能力
  # - "none"：不使用注意力机制（标准GRU）
  # - "self_attention"：自注意力机制，捕获时间步之间的关系
  # - "temporal_attention"：时序注意力，学习每个时间步的重要性权重
  # - 当前值"self_attention"：推荐用于捕获复杂的时序依赖
  attention_type: "self_attention"
  
  # 注意力头数（仅对self_attention生效）
  # - 较多(8-16)：更细粒度的注意力，但计算成本高
  # - 较少(2-4)：计算效率高，适合大多数场景
  # - 当前值4：平衡性能和计算成本
  attention_heads: 4

  # ==================== 正则化 ====================
  # Dropout比例：防止过拟合的随机失活率
  # - 0.2-0.5：强正则化，适合大模型或数据少时
  # - 0.0-0.1：弱正则化，适合小模型或数据充足时
  # - 当前值0.5：增强正则化，防止过拟合
  dropout: 0.3

  # ==================== 优化器配置 ====================
  # 学习率：控制梯度下降步长
  # - 较大(1e-3)：收敛快，但可能震荡或发散
  # - 较小(1e-5)：稳定，但收敛慢，可能陷入局部最优
  # - 当前值3e-4：Adam优化器的推荐值，平衡速度和稳定性
  lr: 0.0002

  # L2正则化系数：防止权重过大
  # - 较大(1e-3)：强约束，防止过拟合
  # - 较小(1e-5)：弱约束，允许模型更灵活
  # - 当前值1e-3：增强L2正则化，防止过拟合
  weight_decay: 0.0005

  # 批次大小：每次训练的样本数
  # - 较大(256-512)：训练快，显存占用高，梯度估计稳定
  # - 较小(32-64)：显存占用低，梯度噪声大，有正则化效果
  # - 当前值128：平衡速度和显存
  batch_size: 256

  # ==================== 训练配置 ====================
  # 最大训练轮数
  # - 较多(50-100)：充分训练，但可能过拟合
  # - 较少(10-20)：快速训练，依赖早停
  # - 当前值30：配合早停，给模型充分优化机会
  max_epochs: 50

  # 随机种子：确保可复现性
  seed: 42

  # 确定性模式：牺牲性能换取完全可复现
  deterministic: true

  # 混合精度训练：加速训练，减少显存占用
  amp: true

  # 梯度裁剪：防止梯度爆炸
  # - 较小(0.5-1.0)：强约束，防止梯度爆炸
  # - 较大(5.0-10.0)：弱约束，允许更大梯度
  # - 当前值1.0：适度的梯度裁剪
  grad_clip_norm: 1.0

  # ==================== 早停策略 ====================
  # 早停监控指标
  # - "loss"：监控验证损失，最小化
  # - "rankic"：监控Rank IC，最大化（推荐用于投资目标）
  # - 当前值"rankic"：直接优化投资相关的排序能力
  early_stopping_metric: "rankic"

  # 早停耐心值：连续多少轮无改善则停止
  # - 较大值(10-20)：给模型更多机会改善
  # - 较小值(3-5)：快速停止，节省时间
  # - 当前值5：更严格的早停，防止过拟合
  patience: 8

  # ==================== 损失函数 ====================
  # 损失函数类型
  # - "mse"：均方误差，对称惩罚正负误差
  # - "weighted_mse"：加权MSE，可设置正负样本权重
  # - "asymmetric_mse"：非对称MSE，对上涨/下跌预测误差不同惩罚
  # - 当前值"asymmetric_mse"：优化投资目标，惩罚低估正向收益
  loss: "asymmetric_mse"

  # 损失函数参数（仅对weighted_mse/asymmetric_mse生效）
  # w_positive: 正样本权重，w_negative: 负样本权重
  # gamma: 非对称惩罚系数，>1表示对低估正向收益的惩罚倍数
  loss_params:
    gamma: 2.5
