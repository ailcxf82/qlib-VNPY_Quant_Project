stack:
  # alpha: 0.5
  # encoding: "embedding"   # 可选 onehot/hash- based，默认哈希压缩
  # hash_dim: 1024       # 哈希维度，之前1024
  # # 为 Embedding 模式添加一个参数（虽然 MLP 会提供默认值 32）
  # embedding_dim: 32       # Embedding 向量的维度
  # # 因为输入变成了稀疏的高维向量，第一层隐层需要足够宽来承载信息
  # hidden_dims: [256, 128]   # 隐藏层维度，之前[256, 128]  [修改] 稍微加宽第一层
  # dropout: 0.6  # 增加 dropout，提高正则化（从0.5增加到0.6）
  # activation: "relu"
  # batch_size: 2048      # 批次大小，之前2048  高维稀疏数据需要大 Batch 才能学到规律
  # lr: 0.001            # 学习率，之前0.001  高维稀疏数据需要小学习率才能稳定收敛
  # weight_decay: 5e-4   # 增加权重衰减，提高正则化（从1e-4增加到5e-4）
  # max_epochs: 50
  # patience: 5

  alpha: 0.5                  # 保持，如果是加权系数的话    
  # --- Embedding 增强 (关键) ---  
  encoding: "embedding"  
  hash_dim: 8192              # [建议修改] 1024->8192，大幅降低股票/行业ID的哈希冲突  
  embedding_dim: 64           # [建议修改] 32->64，提升向量表达能力    
  # --- 网络结构 ---  
  hidden_dims: [256, 128]     # 保持，这个宽度配合 64 dim embedding 够用了 
  activation: "gelu"          # [建议修改] relu->gelu，配合 Embedding 效果更好，防死神经元
  # --- 正则化调整 ---  
  dropout: 0.3                # [建议修改] 0.6->0.3，Meta层信息密度高，不要扔掉太多信息  
  weight_decay: 1e-3          # [建议修改] 5e-4->1e-3，用强 L2 正则替代高 Dropout    
  # --- 训练动力学 ---  
  batch_size: 4096            # [建议修改] 2048->4096，稀疏数据越大 Batch 越稳  
  lr: 0.0005                  # [建议修改] 0.001->0.0005，Meta层需要精细微调，慢工出细活    
  max_epochs: 50              # 保持  
  patience: 8                 # [建议修改] 5->8，给模型多一点时间走出平台期