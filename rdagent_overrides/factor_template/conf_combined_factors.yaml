qlib_init:
    provider_uri: "/mnt/d/qlib_data/qlib_data"
    region: cn

market: &market all
# P3a: keep market=all so RDAgent factor eval uses the full A-share universe
# (csi500 instrument files may be absent in the rdagent conda Qlib data,
#  causing "Empty data from dataset" at model fit time).
benchmark: &benchmark SH000905

data_handler_config: &data_handler_config
    start_time: 2022-01-01
    end_time: 2026-04-30
    instruments: *market
    data_loader:
        class: NestedDataLoader
        kwargs:
            dataloader_l:
                - class: qlib.data.dataset.loader.QlibDataLoader
                  kwargs:
                    config:
                        feature:
                            # ── Short-cycle price/volume alpha ─────────────────────
                            - ["$close_qfq/Ref($close_qfq,1)-1",
                               "$close_qfq/Ref($close_qfq,5)-1",
                               "$close_qfq/Ref($close_qfq,10)-1",
                               "$close_qfq/Ref($close_qfq,20)-1",
                               "Ref($close_qfq,1)/Ref($close_qfq,5)-1",
                               "Std($close_qfq/Ref($close_qfq,1)-1,5)",
                               "Std($close_qfq/Ref($close_qfq,1)-1,10)",
                               "Std($close_qfq/Ref($close_qfq,1)-1,20)",
                               "$vol/Mean($vol,5)",
                               "$vol/Mean($vol,10)",
                               "$vol/Mean($vol,20)",
                               "($high_qfq-$low_qfq)/$close_qfq",
                               "Mean(($high_qfq-$low_qfq)/$close_qfq,5)",
                               "Mean(($high_qfq-$low_qfq)/$close_qfq,10)",
                               # ── Liquidity signals ──────────────────────────────
                               "$turnover_rate",
                               "$turnover_rate_f",
                               "$turnover_rate/Mean($turnover_rate,20)-1",
                               "$volume_ratio",
                               # ── Valuation (fundamental) ────────────────────────
                               "$pe_ttm",
                               "$pb",
                               "$ps_ttm",
                               "Log($total_mv)",
                               "$dv_ratio",
                               # ── Quality / growth ───────────────────────────────
                               "$roe",
                               "$roa",
                               "$q_profit_yoy",
                               "$q_eps",
                               # ── Technical pre-computed ─────────────────────────
                               "$rsi_qfq_12",
                               "$macd_qfq",
                               "$kdj_k_qfq-$kdj_d_qfq",
                               "$atr_qfq",
                               # ── Margin financing pressure ──────────────────────
                               "$rzye/$total_mv",
                               "$rqye/$total_mv"]
                            - ["RET1","MOM5","MOM10","MOM20","MOM1_5","VOL5","VOL10","VOL20",
                               "VRATIO5","VRATIO10","VRATIO20","HLRANGE","HLRANGE5","HLRANGE10",
                               "TURN","TURN_F","TURN_REL","VOLVOL",
                               "PE_TTM","PB","PS_TTM","LOG_MV","DV",
                               "ROE","ROA","PROFIT_YOY","EPS",
                               "RSI12","MACD","KDJ_DIFF","ATR",
                               "MARGIN_L","MARGIN_S"]
                        label:
                            # 与主工程 config/data.yaml 一致：3 日远期相对收益
                            - ["Ref($close_qfq,-3)/Ref($close_qfq,1)-1"]
                            - ["LABEL0"]
                - class: qlib.data.dataset.loader.StaticDataLoader
                  kwargs:
                    # IMPORTANT: this path is RELATIVE to the qrun CWD (the per-loop
                    # RD-Agent workspace directory). rdagent.scenarios.qlib.developer.
                    # factor_runner writes a workspace-local ``combined_factors_df.parquet``
                    # whose columns are ALREADY wrapped as a ('feature', col) MultiIndex
                    # via ``pd.MultiIndex.from_product([['feature'], cols])`` right before
                    # calling ``experiment_workspace.execute(...)``. That shape is what
                    # ``NestedDataLoader`` needs to merge cleanly with ``QlibDataLoader``
                    # (which also emits 2-level MultiIndex columns). An absolute path
                    # pointing at the project's legacy ``git_ignore_folder/combined_factors_df.parquet``
                    # would bypass factor_runner's wrapping and load flat single-level
                    # columns, which triggers:
                    #   MergeError: Not allowed to merge between different levels.
                    #               (2 levels on the left, 1 on the right)
                    # during handler setup and silently NaN-s every backtest metric.
                    config: "combined_factors_df.parquet"

    infer_processors:
        # Align with conf_baseline.yaml: normalise & fill NaN so fundamental
        # features ($pe_ttm, $roe, $roa …) are consistent across time.
        # Without these, NaN-heavy fundamentals inflate IC variance → lower
        # IC_IR → composite never beats SOTA even if user factors are good.
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
              fit_start_time: 2022-01-01
              fit_end_time: 2025-06-30
        - class: Fillna
          kwargs:
              fields_group: feature

    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        # 数据更新至 2026-04-23，test/backtest 窗口同步推进至 2026-Q1~Q2。
        start_time: 2026-01-01
        end_time: 2026-04-30
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            # Aligned to conf_baseline.yaml so composite scores are comparable.
            # Stronger regularisation prevents overfitting when ~36 features
            # (33 base + 3 user) are present; fewer trees keep IC_IR stable.
            loss: mse
            colsample_bytree: 0.75
            learning_rate: 0.05
            subsample: 0.85
            lambda_l1: 80.0
            lambda_l2: 200.0
            max_depth: 6
            num_leaves: 63
            num_threads: 20
            n_estimators: 400
            early_stopping_rounds: 50
            min_child_samples: 60
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                # 数据更新至 2026-04-23，窗口整体后移一年。
                train: [2022-01-01, 2025-06-30]
                valid: [2025-07-01, 2025-12-31]
                test: [2026-01-01, 2026-04-30]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        # PortAnaRecord requires benchmark data which may be unavailable
        # in the local Qlib data. Removing it prevents the benchmark ValueError
        # that crashed the process at Loop 1+. read_exp_res.py already handles
        # missing backtest metrics gracefully: composite = 2.0 * IC_IR when
        # IR and ann_turnover are NaN.
