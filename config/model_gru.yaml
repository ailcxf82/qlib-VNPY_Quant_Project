model:
  # ==================== 序列长度 ====================
  # 序列长度：决定模型回看多少个历史时间步
  # - 较大值(20-60)：能捕获更长期的时间依赖，但需要更多训练数据，容易过拟合
  # - 较小值(5-10)：训练更快，泛化能力更强，适合短期预测
  # - 当前值5：适合捕获短期价格动量，减少过拟合风险
  seq_len: 5

  # ==================== 网络结构 ====================
  # 隐藏层大小：控制模型容量和表达能力
  # - 较大值(64-256)：更强的非线性拟合能力，但容易过拟合，训练慢
  # - 较小值(16-32)：泛化能力强，训练快，适合小数据集
  # - 当前值16：轻量级模型，防止在有限数据上过拟合
  hidden_size: 16

  # GRU层数：控制网络深度
  # - 2-3层：能学习更复杂的时序模式，但梯度问题风险增加
  # - 1层：简单有效，梯度传播稳定，适合大多数场景
  # - 当前值1：单层足够捕获短期依赖，避免梯度消失
  num_layers: 1

  # ==================== 正则化 ====================
  # Dropout比例：防止过拟合的随机失活率
  # - 0.2-0.5：强正则化，适合大模型或数据少时
  # - 0.0-0.1：弱正则化，适合小模型或数据充足时
  # - 当前值0.0：模型已足够小，不需要额外dropout
  dropout: 0.0

  # ==================== 优化器参数 ====================
  # 学习率：控制参数更新步长
  # - 较大值(0.01-0.001)：收敛快，但可能震荡或发散
  # - 较小值(0.0001-0.0005)：收敛稳定，但训练慢
  # - 当前值0.002：适中学习率，配合小batch_size效果良好
  lr: 0.002

  # L2正则化权重衰减：防止过拟合
  # - 较大值(0.01-0.1)：强正则化，限制参数幅度
  # - 较小值(0.0001-0.001)：弱正则化，允许更复杂的模型
  # - 当前值0.001：适度正则化，平衡拟合与泛化
  weight_decay: 0.001

  # ==================== 训练参数 ====================
  # 批次大小：每次更新的样本数
  # - 较大值(512-2048)：训练快，梯度稳定，但可能陷入局部最优
  # - 较小值(32-128)：泛化能力强，噪声有正则化效果
  # - 当前值64：小批次提供更好的泛化和正则化效果
  batch_size: 64

  # 最大训练轮数
  # - 较大值(50-200)：充分训练，但可能过拟合
  # - 较小值(10-30)：快速训练，依赖早停防止欠拟合
  # - 当前值15：配合早停机制，避免过拟合
  max_epochs: 15

  # 随机种子：确保实验可复现
  seed: 42

  # 确定性模式：PyTorch确定性计算
  deterministic: true

  # ==================== 混合精度训练 ====================
  # 自动混合精度(AMP)：加速训练，减少显存占用
  # - true：使用FP16计算，速度提升30-50%，显存减半
  # - false：使用FP32计算，精度更高但速度慢
  # - 当前值true：GPU训练时启用加速
  amp: true

  # 梯度裁剪阈值：防止梯度爆炸
  # - 较大值(1.0-5.0)：允许更大的梯度，可能不稳定
  # - 较小值(0.1-0.5)：严格限制梯度，训练更稳定
  # - 当前值0.5：适度裁剪，防止RNN梯度爆炸
  grad_clip_norm: 0.5

  # ==================== 早停策略 ====================
  # 早停监控指标
  # - "loss"：监控验证损失，最小化
  # - "rankic"：监控Rank IC，最大化
  # - 当前值"loss"：直接优化预测误差
  early_stopping_metric: "loss"

  # 早停耐心值：连续多少轮无改善则停止
  # - 较大值(10-20)：给模型更多机会改善
  # - 较小值(3-5)：快速停止，节省时间
  # - 当前值3：快速响应过拟合，节省训练时间
  patience: 3

  # ==================== 损失函数 ====================
  # 损失函数类型
  # - "mse"：均方误差，对称惩罚正负误差
  # - "weighted_mse"：加权MSE，可设置正负样本权重
  # - "asymmetric_mse"：非对称MSE，对上涨/下跌预测误差不同惩罚
  # - 当前值"mse"：简单有效，适合回归任务
  loss: "mse"

  # 损失函数参数（仅对weighted_mse/asymmetric_mse生效）
  # w_positive: 正样本权重，w_negative: 负样本权重
  loss_params: {}

  # ==================== 预测参数 ====================
  # 预测批次大小：推理时的批次大小
  # - 较大值：预测更快，但需要更多内存
  # - 当前值4096：充分利用GPU并行计算
  predict_batch_size: 4096
