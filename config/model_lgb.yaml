model:
  # ==================== 损失函数 ====================
  # 损失函数类型
  # - "mse"：均方误差，对异常值敏感，适合正态分布目标
  # - "mae"：平均绝对误差，对异常值鲁棒
  # - "huber"：Huber损失，结合MSE和MAE优点
  # - 当前值"mse"：标准回归损失，适合股票收益预测
  loss: "mse"

  # ==================== 训练轮数 ====================
  # 最大提升轮数：树的数量
  # - 较大值(2000-5000)：更强的拟合能力，但可能过拟合
  # - 较小值(500-1000)：快速训练，泛化能力强
  # - 当前值1500：配合早停，充分训练同时防止过拟合
  num_boost_round: 1500

  # 早停轮数：连续多少轮无改善则停止
  # - 较大值(100-200)：给模型更多机会，但训练时间长
  # - 较小值(30-50)：快速停止，节省时间
  # - 当前值80：平衡训练充分性和效率
  early_stopping_rounds: 80

  # ==================== LightGBM核心参数 ====================
  params:
    # 目标函数
    # - "regression"：标准回归
    # - "huber"：Huber回归，对异常值鲁棒
    # - "quantile"：分位数回归
    # - 当前值"huber"：减少异常值影响，提高稳定性
    objective: "huber"

    # 提升类型
    # - "gbdt"：传统梯度提升决策树，稳定可靠
    # - "dart"：Dropout提升，更好的泛化但训练慢
    # - "goss"：基于梯度的采样，训练快
    # - 当前值"gbdt"：经典方法，稳定性好
    boosting_type: "gbdt"

    # 学习率：每棵树的贡献权重
    # - 较大值(0.1-0.3)：收敛快，但可能欠拟合
    # - 较小值(0.01-0.05)：收敛慢，泛化能力强
    # - 当前值0.02：较小学习率，配合更多树数提升精度
    learning_rate: 0.02

    # ==================== 树结构参数 ====================
    # 最大深度：限制树的深度
    # - 较大值(8-15)：能学习更复杂的模式，但容易过拟合
    # - 较小值(3-6)：泛化能力强，防止过拟合
    # - 当前值6：中等深度，平衡复杂度和泛化
    max_depth: 6

    # 叶子节点数：控制模型复杂度
    # - 较大值(63-127)：更细粒度的划分，但容易过拟合
    # - 较小值(15-31)：粗粒度划分，泛化能力强
    # - 经验值：num_leaves <= 2^(max_depth-1)
    # - 当前值31：配合max_depth=6，充分利用深度
    num_leaves: 31

    # ==================== 特征采样 ====================
    # 特征采样比例：每棵树使用的特征比例
    # - 1.0：使用全部特征，可能过拟合
    # - 0.5-0.8：随机采样特征，增加多样性，防止过拟合
    # - 当前值0.7：70%特征采样，平衡精度和泛化
    feature_fraction: 0.7

    # 数据采样比例：每棵树使用的样本比例
    # - 1.0：使用全部样本
    # - 0.5-0.8：随机采样样本，类似bagging效果
    # - 当前值0.7：70%样本采样，增加模型多样性
    bagging_fraction: 0.7

    # bagging频率：每多少轮进行一次bagging
    # - 当前值1：每轮都进行bagging
    bagging_freq: 1

    # ==================== 正则化参数 ====================
    # L1正则化：稀疏性惩罚
    # - 较大值(0.5-1.0)：强L1正则，产生稀疏特征选择
    # - 较小值(0-0.3)：弱L1正则，保留更多特征
    # - 当前值0.3：适度稀疏化，自动特征选择
    lambda_l1: 0.3

    # L2正则化：权重衰减惩罚
    # - 较大值(1.0-5.0)：强L2正则，限制叶子权重
    # - 较小值(0-1.0)：弱L2正则，允许更复杂的模型
    # - 当前值1.5：较强L2正则，防止过拟合
    lambda_l2: 1.5

    # 叶子节点最小样本数：防止过拟合
    # - 较大值(100-200)：更保守，泛化能力强
    # - 较小值(10-30)：更灵活，可能过拟合
    # - 当前值50：确保每个叶子有足够样本支持
    min_data_in_leaf: 50

    # 日志级别：-1为静默模式
    verbosity: -1

    # ==================== GPU加速配置 ====================
    # 设备类型：使用GPU加速训练
    # - "cpu"：CPU训练（默认）
    # - "gpu"：GPU训练，速度提升5-10倍
    # - 当前值"gpu"：启用GPU加速
    device: "gpu"

    # GPU平台：指定GPU计算后端
    # - "cuda"：NVIDIA GPU（需要CUDA支持）
    # - "opencl"：OpenCL兼容GPU
    # - 当前值"cuda"：NVIDIA GPU
    gpu_platform_id: 0

    # GPU设备ID：指定使用哪个GPU
    # - 0：使用第一个GPU
    # - 1：使用第二个GPU（如果有多个）
    gpu_device_id: 0

    # GPU使用显存比例：限制GPU显存使用
    # - 0.0-1.0：显存使用比例
    # - 当前值0.5：最多使用50%显存，避免OOM
    gpu_use_dp: false
