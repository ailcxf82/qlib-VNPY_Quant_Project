data_config: "config/data.yaml"
lightgbm_config: "config/model_lgb.yaml"
mlp_config: "config/model_mlp.yaml"
gru_config: "config/model_gru.yaml"
stack_config: "config/model_stack.yaml"

# 只改配置即可启用基模型：
# - 目前暂时停用 MLP、启用 GRU（仍保留 LGB，因为 Stack/Leaf 依赖 LGB 输出 leaf）
base_models: ["lgb", "gru"]

# 可选：按模型指定特征集合（来自 data.yaml 的 feature_sets）
# 例如：gru 使用 OHLCV，lgb 使用基本面/融资
model_features:
  gru: "gru_ohlcv"
  lgb: "lgb_fundamental"

# model_features: {}

# GRU 超参：若此处为 dict，会优先覆盖 gru_config；
# 现在设为 null，表示使用 config/model_gru.yaml
model_gru: null

ensemble:
  # 聚合策略选项：
  # - "average": 简单平均（Qlib 标准化后平均）
  # - "weighted_average": 基于验证集 ICIR 的加权平均（推荐）
  # - "meta_learner": Meta-Learner（Ridge 回归，默认 alpha=1.0）
  # - "meta_learner_linear": Meta-Learner（线性回归）
  # - "meta_learner_ridge": Meta-Learner（Ridge 回归，alpha=1.0）
  aggregator: "weighted_average"
  # Meta-Learner 参数（仅当 aggregator="meta_learner" 时使用）
  aggregator_params:
    model_type: "ridge"  # "linear" 或 "ridge"
    alpha: 1.0  # Ridge 回归的正则化系数
  # 重要：这里留空，让系统从 base_models 自动派生模型清单（从而“只改配置即可”）
  models: []

rolling:
  # 窗口生成模式：
  # - classic（默认/兼容旧逻辑）：data.start_time 视作“训练起点”，valid_start = start_time + train_days
  # - aligned（多模型对齐推荐）：data.start_time 视作“验证起点锚点”，train_end = valid_start - 1，
  #   并自动把取数 start_time 向前扩展到 (anchor_start - max_train_days)，确保历史足够
  window_mode: "aligned"

  # 特征归一化策略：
  # - per_model（方案B，推荐）：每个模型用自己的训练窗口拟合 mean/std，再应用到该模型的 train/valid/predict
  #   优点：修改某个模型（如 lgb）的训练窗口不会影响其它模型（如 gru）的输入分布与 IC
  # - global（旧逻辑）：所有模型共用同一套窗口归一化（会产生模型间耦合）
  # - none：不做归一化（一般不推荐）
  feature_normalization: "per_model"

  # 全局训练窗口（当未配置 model_train_days 时，所有模型共用该值）
  train_days: 120
  # 可选：按模型分别设置训练窗口（单位：交易日个数；按“datetime 去重计数”裁剪）
  # 配置后会自动启用 window_mode=aligned，让 lgb/gru 在同一 valid 窗口上对齐
  model_train_days:
    lgb: 720
    gru: 240
  valid_days: 30   # 验证窗口：30天（约1个月）
  test_days: 30    # 测试窗口：30天（约1个月）
  step_days: 5     # 滚动步长：1天（按日训练）
  min_samples: 2000

ic_logging:
  window: 60  # IC 历史窗口大小
  half_life: 20  # 半衰期（用于指数衰减权重）
  min_weight: 0.05  # 最小权重（防止模型权重过低）
  max_weight: 0.5  # 最大权重（防止单一模型权重过大，默认 0.5，原为 0.7）
  clip_negative: true  # 是否裁剪负 ICIR
  use_softmax: false  # 是否使用 softmax 平滑 ICIR 差异（可选，默认 false）
  temperature: 1.0  # softmax 温度参数（越大权重分布越均匀，仅在 use_softmax=true 时生效）

paths:
  model_dir: "data/models"
  log_dir: "data/logs"
  prediction_dir: "data/predictions"
  backtest_dir: "data/backtest"
  oof_dir: "data/oof"
  meta_dir: "data/meta"

# 可选：OOF + Meta-Stacking（二层模型）。默认关闭，不影响现有训练/预测流程。
oof_stacking:
  enabled: "auto"   # auto: base_models 包含 gru 时自动开启 OOF+MetaStacking
  use_cache: true
  n_splits: 5
  # 固定每折验证期长度（按“日期个数/交易日数”理解），为空则自动等分
  valid_days_per_fold: 20
  min_train_days: 120
  gap_days: 0
  meta_model:
    model_type: "ridge"
    alpha: 1.0

portfolio:
  max_position: 0.3
  max_stock_weight: 0.05
  max_industry_weight: 0.2
  top_k: 50

