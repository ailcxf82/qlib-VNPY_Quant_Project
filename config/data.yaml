qlib:
  provider_uri: "D:/qlib_data/qlib_data"
  region: "cn"

data:
  instruments: "csi300, csi101"
  start_time: "2026-01-01"
  end_time: "2026-03-28"
  freq: "day"
  
  missing_value_strategy: "auto"
  
  use_alpha158: false

  feature_sets:
    # ==================== GRU OHLCV特征集（时序模型专用）====================
    # 包含价格、成交量、波动率等时序特征，适合GRU等序列模型
    gru_ohlcv:
      # 基础价格特征
      - "Ref($close, 1)"
      - "Ref($open, 1)"
      - "Ref($high, 1)"
      - "Ref($low, 1)"
      - "Ref($volume, 1)"
      
      # 收益率特征
      - "Ref($close, 2)/Ref($close, 1) - 1"
      - "Ref($volume, 2)/Ref($volume, 1) - 1"
      
      # 均线特征
      - "Mean(Ref($close, 1), 5)/Ref($close, 1) - 1"
      - "Mean(Ref($close, 1), 10)/Ref($close, 1) - 1"
      - "Mean(Ref($close, 1), 20)/Ref($close, 1) - 1"
      
      # 波动率特征
      - "Std(Ref($close, 1), 5)"
      - "Std(Ref($close, 1), 10)"
      - "Std(Ref($close, 1), 20)"
      
      # 换手率特征
      - "Ref($turnover_rate, 1)"
      - "Mean(Ref($turnover_rate, 1), 5)"
      - "Ref($volume, 1) / Mean(Ref($volume, 1), 5) - 1"
      
      # 动量因子
      - "Ref($close, 5)/Ref($close, 10) - 1"
      - "Ref($close, 10)/Ref($close, 20) - 1"
      
      # 波动率因子
      - "Std(Ref($close, 1), 20) / Mean(Ref($close, 1), 20)"
      - "(Ref($high, 1) - Ref($low, 1)) / Ref($close, 1)"
      
      # 价格位置因子
      - "(Ref($close, 1) - Min(Ref($low, 1), 20)) / (Max(Ref($high, 1), 20) - Min(Ref($low, 1), 20))"
      - "(Ref($close, 1) - Mean(Ref($close, 1), 20)) / Std(Ref($close, 1), 20)"

    # ==================== LGB基本面特征集（树模型专用）====================
    # 包含估值、成长、质量、资金流向等基本面特征，适合LightGBM等树模型
    lgb_fundamental:
      # ========== 估值因子 ==========
      - "Ref($pe, 1)"
      - "Ref($pb, 1)"
      - "Ref($ps, 1)"
      - "1/Ref($pe, 1)"
      - "Ref($market_cap, 1)"
      - "Ref($pe, 1)/Mean(Ref($pe, 1), 20) - 1"
      - "Ref($pb, 1)/Mean(Ref($pb, 1), 20) - 1"
      - "Ref($pe, 1) / Ref($net_profit_growth, 1)"
      
      # ========== 成长因子 ==========
      - "Ref($roe, 1)"
      - "Ref($net_profit_margin, 1)"
      - "Ref($net_profit_growth, 1)"
      - "Ref($eps_growth, 1)"
      - "Ref($asset_turnover, 1)"
      - "Ref($roe, 1)/Mean(Ref($roe, 1), 4) - 1"
      - "Ref($net_profit_margin, 1) * Ref($asset_turnover, 1)"
      
      # ========== 资金流向因子 ==========
      - "Ref($net_mf_amount, 1)"
      - "Ref($buy_elg_amount, 1)"
      - "Ref($buy_lg_amount, 1)"
      - "Ref($buy_md_amount, 1)"
      - "Ref($buy_sm_amount, 1)"
      - "Ref($net_mf_amount, 1) / Ref($market_cap, 1)"
      
      # ========== 情绪因子 ==========
      - "Ref($margin_balance, 1)"
      - "Ref($short_balance, 1)"
      - "Ref($margin_balance, 2)/Ref($margin_balance, 1) - 1"
      - "Ref($short_balance, 2)/Ref($short_balance, 1) - 1"
      
      # ========== 技术面因子 ==========
      - "(Ref($close, 1) - Ref($open, 1)) / Ref($open, 1)"
      - "(Ref($high, 1) - Ref($low, 1)) / Ref($close, 1)"
      - "(Ref($close, 1) - Mean(Ref($close, 1), 20)) / Std(Ref($close, 1), 20)"
      - "Ref($close, 5)/Ref($close, 20) - 1"
      - "Ref($close, 20)/Ref($close, 60) - 1"
      - "Std(Ref($turnover_rate, 1), 10)"
      - "Ref($volume, 1) / Mean(Ref($volume, 1), 20) - 1"

  active_feature_sets: ["gru_ohlcv", "lgb_fundamental"]
  
  label: "Ref($close, -5)/Ref($close, 1) - 1"
  label_transform:
    enabled: true
    method: "percentile"
    groupby: "datetime"
  filter:
    limit_up: true
    limit_down: true
  normalization: "zscore"
