# RQAlpha 回测配置 - CSI101 专用
# 针对中小盘股票优化的参数配置

# 回测基础参数
base:
  # 回测起始日期（格式：YYYY-MM-DD）
  start_date: "2025-06-01"
  # 回测结束日期（格式：YYYY-MM-DD）
  end_date: "2026-02-28"
  # 初始资金（单位：元）
  initial_cash: 10000000  # 1000万
  # 基准指数（中小综指）
  benchmark: "399005.XSHE"
  # 数据源
  data_bundle_path: null

# 交易成本
commission:
  # 手续费率（中小盘股票流动性差，适当提高）
  commission_rate: 0.0005  # 万分之5
  # 最小手续费（单位：元）
  min_commission: 5.0

# 滑点设置（中小盘股票滑点更大）
slippage:
  # 滑点率
  slippage_rate: 0.0002  # 万分之2
  # 滑点类型
  slippage_type: "fixed"

# 交易限制
trading:
  # 是否允许卖空
  short_selling: false
  # 是否允许融资
  margin: false
  # 是否允许融券
  stock_short_selling: false
  # 是否允许日内交易（T+0）
  day_trade: false  # T+1 交易

# 风控参数（中小盘股票需要更严格的风控）
risk:
  # 单只股票最大持仓比例（降低以分散风险）
  max_stock_weight: 0.08  # 8%
  # 单行业最大持仓比例
  max_industry_weight: 0.15  # 15%
  # 最大总仓位比例
  max_position: 0.3  # 30%
  # 每期选股数量（增加以分散风险）
  top_k: 15

# 输出设置
output:
  # 回测结果输出目录
  output_dir: "data/backtest/rqalpha/csi101"
  # 是否生成详细报告
  generate_report: true
  # 是否保存持仓明细
  save_positions: true
  # 是否保存交易记录
  save_trades: true

# 策略额外参数 - CSI101 专用优化（更激进的策略）
extra:
  context_vars:
    # 调仓频率（中小盘股票需要灵活调整）
    rebalance_interval: 5  # 5天调仓一次
    
    # ========== 卖出策略优化 ==========
    # 卖出阈值：当前预测值低于买入预测值的比例时才卖出
    # CSI101: 适度提高阈值，更快卖出
    sell_threshold: 0.5  # 0.5 表示当前预测值 < 买入预测值 * 0.5 时才卖出
    
    # 最小持仓天数（中小盘股票需要灵活调整）
    min_holding_days: 7  # 至少持仓7天
    
    # 是否启用智能卖出
    smart_sell_enabled: true
    
    # ========== 新增：预测值下降阈值 ==========
    # 预测值从高点下降的幅度超过此阈值时才考虑卖出
    # 降低阈值，更敏感地响应预测值变化
    prediction_decline_threshold: 0.15
    
    # ========== 新增：高预测值保护 ==========
    # 当预测值高于此阈值时，不主动卖出（除非触发止损）
    # 降低保护阈值，允许在高预测值时卖出
    high_prediction_protection: 0.5
    
    # ========== 新增：止盈止损参数 ==========
    # 止盈比例（中小盘股票波动大，设置更严格）
    take_profit_ratio: 0.2  # 盈利20%考虑止盈
    
    # 止损比例（更严格的止损）
    stop_loss_ratio: -0.10  # 亏损10%止损
    
    # ========== 新增：波动率调整 ==========
    # 是否根据波动率动态调整卖出阈值
    volatility_adjusted_sell: true
    
    # 波动率计算窗口
    volatility_window: 20
    
    # 高波动股票的卖出阈值调整系数
    # 高波动股票使用更低的卖出阈值（更难卖出）
    high_volatility_threshold_multiplier: 0.7
