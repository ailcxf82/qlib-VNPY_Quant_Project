# A股高价值因子知识库
# 来源：学术论文 + 国内量化研究报告 + WorldQuant Alpha101 精选
# 格式：每个因子含 id / family / name / formula / columns_used / expected_ic / notes
#
# 使用方式：factor_lab/adapters/rag_retriever.py 读取此文件，
#           在 prepare_context() 时将 top-K 相似因子注入到 scenario 中。

schema_version: "1.0"

factors:

  # ── 基本面 / 价值 ────────────────────────────────────────────────────────────

  - id: val_001
    family: value
    name: PE_ZScore_60D
    formula: |
      x = df["$pe_ttm"].groupby(level="instrument").transform(lambda s: s.ffill())
      med = x.groupby(level="instrument").transform(lambda s: s.rolling(60).median())
      std = x.groupby(level="instrument").transform(lambda s: s.rolling(60).std())
      factor = -(x - med) / (std + 1e-8)   # 负号：低PE超额收益
    columns_used: [$pe_ttm]
    expected_ic: 0.015
    notes: >
      Barra VALUE 类因子. 均值回归信号. 在 A 股 price-to-earnings 有效性强.
      取负号因为低PE→高未来收益.

  - id: val_002
    family: value
    name: EarningsYield_PB_Combo
    formula: |
      ey = 1.0 / (df["$pe_ttm"].groupby(level="instrument").transform(lambda s: s.ffill()) + 1e-3)
      bm = 1.0 / (df["$pb"].groupby(level="instrument").transform(lambda s: s.ffill()) + 1e-3)
      factor = (ey.groupby(level="instrument").transform(lambda s: s.rank(pct=True)) +
                bm.groupby(level="instrument").transform(lambda s: s.rank(pct=True))) / 2
    columns_used: [$pe_ttm, $pb]
    expected_ic: 0.018
    notes: >
      综合盈利收益率+账面市值比. 经典 Fama-French HML 实现.

  - id: val_003
    family: value
    name: PEG_Signal_60D
    formula: |
      pe = df["$pe_ttm"].groupby(level="instrument").transform(lambda s: s.ffill())
      g = df["$q_profit_yoy"].groupby(level="instrument").transform(lambda s: s.ffill())
      g_pos = g.clip(lower=0.01)  # 避免负增长导致分母符号翻转
      peg = pe / g_pos
      factor = -peg.groupby(level="instrument").transform(lambda s: s.rolling(20).mean())
    columns_used: [$pe_ttm, $q_profit_yoy]
    expected_ic: 0.012
    notes: >
      PEG ratio. 低PEG→成长溢价. 注意负增长股票需特殊处理.

  # ── 盈利质量 / 成长 ─────────────────────────────────────────────────────────

  - id: qual_001
    family: quality
    name: ROE_Momentum_60D
    formula: |
      roe = df["$roe"].groupby(level="instrument").transform(lambda s: s.ffill())
      factor = roe - roe.groupby(level="instrument").transform(lambda s: s.shift(60))
    columns_used: [$roe]
    expected_ic: 0.014
    notes: >
      ROE 环比变化. 捕捉盈利改善方向. 与 ROE 水平因子正交.
      在 A 股季报发布密集期效果更强.

  - id: qual_002
    family: quality
    name: ROE_ROA_Spread
    formula: |
      roe = df["$roe"].groupby(level="instrument").transform(lambda s: s.ffill())
      roa = df["$roa"].groupby(level="instrument").transform(lambda s: s.ffill())
      factor = roa - (roa * roe / (roe + 1e-6))  # ROA / (1 + 负债率代理)
    columns_used: [$roe, $roa]
    expected_ic: 0.010
    notes: >
      财务杠杆质量. ROA-ROE 差越小 → 杠杆使用合理.

  - id: qual_003
    family: quality
    name: EarningsRevision_4Q
    formula: |
      g = df["$q_profit_yoy"].groupby(level="instrument").transform(lambda s: s.ffill())
      med4q = g.groupby(level="instrument").transform(lambda s: s.rolling(4*20, min_periods=40).median())
      factor = g - med4q
    columns_used: [$q_profit_yoy]
    expected_ic: 0.016
    notes: >
      盈利修正信号. 利润增速相对自身历史中位数偏差.
      对应券商推荐调升事件的截面代理.

  # ── 动量 / 残差动量 ──────────────────────────────────────────────────────────

  - id: mom_001
    family: momentum
    name: ResidualMomentum_90D
    formula: |
      ret90 = df["$close_qfq"].groupby(level="instrument").transform(lambda s: s.pct_change(90))
      mkt_ret = ret90.groupby(level="datetime").transform("mean")  # 市场等权收益
      factor = ret90 - mkt_ret  # 去市场贝塔的残差动量
    columns_used: [$close_qfq]
    expected_ic: 0.013
    notes: >
      Fama 1996 残差动量. 去除市场波动后的股票特质动量.
      W=90 在 A 股月度再平衡下表现好于 W=60.

  - id: mom_002
    family: momentum
    name: SkipOneMomentum_12_1
    formula: |
      ret_12m = df["$close_qfq"].groupby(level="instrument").transform(lambda s: s.pct_change(240))
      ret_1m = df["$close_qfq"].groupby(level="instrument").transform(lambda s: s.pct_change(20))
      factor = ret_12m - ret_1m  # 跳过最近1个月，避免短期反转干扰
    columns_used: [$close_qfq]
    expected_ic: 0.011
    notes: >
      Jegadeesh-Titman skip-one-month momentum.
      解决短期反转污染长期动量的经典问题.

  - id: mom_003
    family: momentum
    name: OvernightReturn_Persistence
    formula: |
      overnight = df["$open_qfq"] / df["$close_qfq"].groupby(level="instrument").transform(lambda s: s.shift(1)) - 1
      factor = overnight.groupby(level="instrument").transform(lambda s: s.rolling(20).mean())
    columns_used: [$open_qfq, $close_qfq]
    expected_ic: 0.014
    notes: >
      隔夜跳空信息持续性. 捕捉盘后信息流向. A 股特色: 开盘集合竞价含信息量.
      Alpha158 完全未覆盖此信号.

  # ── 流动性 ───────────────────────────────────────────────────────────────────

  - id: liq_001
    family: liquidity
    name: Amihud_Trend_60D
    formula: |
      ret = df["$close_qfq"].groupby(level="instrument").transform(lambda s: s.pct_change().abs())
      vol = df["$volume"].clip(lower=1)
      illiq = ret / vol
      illiq20 = illiq.groupby(level="instrument").transform(lambda s: s.rolling(20).mean())
      illiq60 = illiq.groupby(level="instrument").transform(lambda s: s.rolling(60).mean())
      factor = illiq20 - illiq60   # 流动性改善方向 (负值=变好)
    columns_used: [$close_qfq, $volume]
    expected_ic: 0.012
    notes: >
      Amihud (2002) 非流动性趋势. 流动性改善→超额收益.
      与水平值因子 amihud_illiquidity_20d 正交.

  - id: liq_002
    family: liquidity
    name: TurnoverVariance_20D
    formula: |
      t = df["$turnover_rate"]
      t_mean = t.groupby(level="instrument").transform(lambda s: s.rolling(60).mean() + 1e-8)
      t_norm = t / t_mean
      factor = 1.0 / (t_norm.groupby(level="instrument").transform(lambda s: s.rolling(20).std()) + 1e-8)
    columns_used: [$turnover_rate]
    expected_ic: 0.010
    notes: >
      换手率稳定性. 高稳定性(低方差) → 机构重仓 → 超额收益持续.

  # ── 资金流向 / 智能资金 ────────────────────────────────────────────────────

  - id: smart_001
    family: smart_money
    name: MarginNetRatioTrend_20_60
    formula: |
      net_ratio = (df["$rzye"] - df["$rqye"]) / (df["$total_mv"] + 1e-6)
      ma20 = net_ratio.groupby(level="instrument").transform(lambda s: s.rolling(20).mean())
      ma60 = net_ratio.groupby(level="instrument").transform(lambda s: s.rolling(60).mean())
      factor = ma20 - ma60
    columns_used: [$rzye, $rqye, $total_mv]
    expected_ic: 0.013
    notes: >
      融资融券净比率趋势. 融资增速>融券→智能资金看多方向信号.
      短均线上穿长均线 → 看多动量.

  - id: smart_002
    family: smart_money
    name: ShortSellPressure_20D
    formula: |
      short_ratio = df["$rqye"] / (df["$rzye"] + df["$rqye"] + 1e-6)
      factor = -short_ratio.groupby(level="instrument").transform(lambda s: s.rolling(20).mean())
    columns_used: [$rzye, $rqye]
    expected_ic: 0.009
    notes: >
      融券卖空压力. 卖空比例高→看空情绪强→负向信号(取负值).

  # ── 行业相对估值（需要 $sw_l1_code 列）────────────────────────────────────

  - id: sect_001
    family: industry_relative
    name: PE_IndustrZScore_60D
    formula: |
      # 仅在 $sw_l1_code 可用时使用行业分组；否则退化为全市场分组
      pe = df["$pe_ttm"].groupby(level="instrument").transform(lambda s: s.ffill())
      if "$sw_l1_code" in df.columns:
          sectors = df["$sw_l1_code"]
          pe_med = pe.groupby([pe.index.get_level_values("datetime"), sectors]).transform("median")
          pe_std = pe.groupby([pe.index.get_level_values("datetime"), sectors]).transform("std")
      else:
          pe_med = pe.groupby(level="datetime").transform("median")
          pe_std = pe.groupby(level="datetime").transform("std")
      factor = -(pe - pe_med) / (pe_std + 1e-6)
    columns_used: [$pe_ttm, $sw_l1_code]
    expected_ic: 0.016
    notes: >
      行业相对PE. 行业内低估→超额收益. 消除行业轮动对估值的干扰.
      若无行业列，退化为全市场 zscore，仍有效但信噪比降低.
