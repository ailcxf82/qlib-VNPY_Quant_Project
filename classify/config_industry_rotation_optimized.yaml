# ========== 行业轮动预测系统配置文件（优化版）==========
# 基于训练结果分析，针对过拟合问题进行优化
# 目标：预测未来 10 天的行业相对收益排名

# ========== 数据配置 ==========
data_config: "classify/config_data_industry_baseline.yaml"

# ========== 模型配置（优化版）==========
# IndustryGRU 模型配置
industry_gru_config:
  num_features: null  # 自动从数据中推断
  sequence_length: 60  # 时序长度：60天
  
  # 🔴 优先级1：降低模型复杂度（最重要）
  hidden_size: 32  # ⬇️ 从 64 降到 32（降低模型容量）
  num_layers: 1  # ⬇️ 从 2 降到 1（单层 GRU 通常足够）
  attention_hidden_dim: 32  # ⬇️ 从 64 降到 32
  
  # 🟠 优先级2：增强正则化
  dropout: 0.3  # ⬆️ 从 0.2 增到 0.3（更强的正则化）
  weight_decay: 5e-4  # ⬆️ 从 1e-4 增到 5e-4（更强的权重衰减）
  grad_clip: 1.0  # 保持梯度裁剪
  
  # 🔵 优先级5：调整损失函数
  loss: "ranking"  # 保持 Ranking Loss
  ranking_alpha: 0.5  # ⬇️ 从 0.7 降到 0.5（平衡 MSE 和 Ranking）
  
  # 🟡 优先级3：调整训练策略
  batch_size: 64  # 保持当前值
  lr: 0.001  # ⬆️ 从 0.0007 增到 0.001（加快收敛）
  lr_scheduler: "plateau"  # 保持学习率调度器
  max_epochs: 50  # ⬇️ 从 80 降到 50（减少训练轮数）
  patience: 5  # ⬇️ 从 12 降到 5（更早的早停）

# ========== 滚动训练配置（优化版）==========
rolling:
  train_months: 22  # ⬇️ 从 24 降到 22（为验证集腾出空间）
  valid_months: 2  # ⬆️ 从 1 增到 2（更稳定的评估，约40个交易日）
  test_months: 1  # 测试窗口：1个月
  step_months: 1  # 滚动步长：1个月
  min_samples: 100  # 最小样本数

# ========== IC 日志配置 ==========
ic_logging:
  window: 60  # IC 计算窗口
  half_life: 20  # 半衰期

# ========== 路径配置 ==========
paths:
  model_dir: "data/models/industry_rotation"
  log_dir: "data/logs/industry_rotation"
  prediction_dir: "data/predictions/industry_rotation"
  backtest_dir: "data/backtest/industry_rotation"

# ========== 组合配置 ==========
portfolio:
  max_position: 1.0  # 最大仓位（行业轮动通常满仓）
  max_industry_weight: 0.15  # 单个行业最大权重（31个行业，平均约3.2%）
  top_k: 10  # 选择排名前 K 个行业

# ========== 回测指标配置 ==========
backtest_metrics:
  - "IC"  # 信息系数
  - "Rank IC"  # 排名信息系数
  - "Long-Short Return"  # 多空收益
  - "Annual Return"  # 年化收益
  - "Sharpe Ratio"  # 夏普比率
  - "Max Drawdown"  # 最大回撤














