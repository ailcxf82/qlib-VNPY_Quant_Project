# 阶段 F.3：RD-Agent RAG 静态宪法 YAML 版
#
# 研究员扩展 encouraged / discouraged / columns / windows 等时直接改本文件，不用改代码。
#
# 结构：
#   - version：schema 版本，不兼容升级需要 bump。
#   - allowed_windows / allowed_primitives / forbidden_patterns：规则 1-4 的数据源。
#   - columns：daily_pv.h5 的可用列表（规则 5）。
#   - columns_nan_note：列里哪些有 NaN 的说明文本。
#   - scoring：打分公式 + 优化目标 + 经验教训。
#   - feature_universe：现有 lgb_short_cycle 的 32 列。
#   - orthogonality_rules：6a/6b/6c 三条硬要求。
#   - encouraged_families：高分期望的家族（用于 RAG 正向示范）。
#   - discouraged_families：低分家族（用于 RAG 负向警告）。
#   - naming_convention：因子命名规范。
#
# 兼容性：
#   YAML 损坏 / 缺失 → 回退到 factor_lab/config/constitution.py 里的
#   _FALLBACK_CONSTITUTION_TEXT（与本 YAML 的默认渲染输出保持 byte-for-byte 一致）。

version: "1.0"

allowed_windows: [5, 10, 20, 30, 60, 90, 120]
# 新增 90/120 日捕获中长期趋势（Barra MOMENTUM 用 252d，这里取次级近似）

allowed_primitives:
  - pct_change
  - shift
  - rolling(W).mean/std/sum/min/max/corr/skew/kurt
  - rank
  - clip
  - groupby(level="instrument").transform
  - groupby("$sw_l1_code").transform  # 行业内中性化排名

forbidden_patterns:
  - nested rolling correlations across many series
  - loops
  - '"10 pairs" patterns'
  - "groupby(...).apply(...) for final output column (use transform instead)"

columns:
  # v2 (2026-05-21): 42 columns — full qlib coverage, native names
  Price/raw:      [$close, $open, $high, $low]
  Price/fwd-adj:  [$close_qfq, $open_qfq, $high_qfq, $low_qfq]
  Volume:         [$vol, $volume, $amount]
  Liquidity:      [$turnover_rate, $turnover_rate_f, $volume_ratio]
  Technical:      [$rsi_qfq_12, $macd_qfq, $macd_dif_qfq, $macd_dea_qfq,
                   $kdj_k_qfq, $kdj_d_qfq, $kdj_qfq, $atr_qfq, $mtmma_qfq]
  Valuation:      [$pe, $pe_ttm, $pb, $ps, $ps_ttm, $total_mv, $dv_ratio, $dv_ttm]
  Quality:        [$roe, $q_profit_yoy, $q_eps, $assets_turn, $profit_to_gr]
  MoneyFlow:      [$net_amount, $buy_elg_amount, $buy_lg_amount, $buy_md_amount, $buy_sm_amount]
  Margin:         [$rzye, $rqye]

columns_nan_note: |-
  NOTE: Valuation/Quality columns ($pe_ttm/$pb/$roe/$q_profit_yoy etc.) have NaN for quarterly data.
        Always: df['$col'] = df['$col'].groupby(level='instrument').transform(lambda s: s.ffill())
  NOTE: MoneyFlow columns ($net_amount/$buy_*_amount) may have NaN for stocks with no institutional data.
  NOTE: $roa and $roa2_yearly are NOT available (all-NaN in data source) — do NOT use them.
  NOTE: Instrument code format is '000001.SZ' / '600000.SH' / '430047.BJ'
        (6-digit code + dot + exchange suffix, case-insensitive).
        DO NOT rewrite to 'SH600000' prefix format.
        Preserve MultiIndex (datetime, instrument) index as-is from loaded dataframe.

scoring:
  formula: "1day.composite_score = 1.0*IR + 2.0*IC_IR - 0.5*log(1+annualized_turnover)"
  optimization_targets:
    - "IR  (information_ratio of excess_return_with_cost) \u2014 real backtest signal-to-noise"
    - "IC_IR (Rank IC mean / IC std) \u2014 signal stability"
    - "annualized_turnover \u2014 penalised; high-frequency switching hurts the score."
  historical_lesson: |-
    Empirical lesson (csi300_RD_v2, 2025-11~2026-03):
      Adding 5 short-cycle volume-price-reversal factors raised LGB valid-IC from 0.148
      to 0.226 BUT realised Sharpe DROPPED 3.59→1.69 (turnover doubled 4.7→8.75x).
      DO NOT propose short-cycle volume-price-reversal factors.

    Successful pattern (v17→v19 certified factors):
      Slow-moving fundamental factors (ValueMR_20D, AmihudIlliquidity_20D, OvernightReturn_5D)
      yield composite_score > 2.0 with turnover < 3.0. Target this regime.

    Diversity lesson (v19 pool, 15 active factors):
      The current pool is concentrated in volume/liquidity family.
      HIGH PRIORITY: propose factors from UNTAPPED families:
        - earnings quality / fundamental revision (no certified factor yet)
        - industry-relative valuation (no certified factor yet)
        - long-horizon residual momentum W=90/120 (no certified factor yet)
        - margin financing smart-money trend (only 1 factor, need more variants)

feature_universe:
  name: lgb_short_cycle
  column_count: 32
  groups:
    Returns/Momentum: [RET1, MOM5, MOM10, MOM20, MOM1_5]
    Volatility:       [VOL5, VOL10, VOL20]
    Volume ratios:    [VRATIO5, VRATIO10, VRATIO20, VOLVOL]
    Range:            [HLRANGE, HLRANGE5, HLRANGE10]
    Liquidity:        [TURN, TURN_F, TURN_REL]
    Valuation:        [PE_TTM, PB, PS_TTM, LOG_MV]
    Quality:          [ROE, ROA, PROFIT_YOY]
    Technical:        [RSI12, MACD, KDJ_DIFF, ATR]
    Margin:           [MARGIN_L, MARGIN_S]

orthogonality_rules:
  - |-
    6.a) New factor MUST satisfy |Spearman(new_factor, X)| <= 0.50 for every X above
         (when X is a strict superset, prove orthogonality through transformation).
  - |-
    6.b) New factor's day-over-day cross-sectional rank auto-correlation MUST be
         >= 0.60 (slow-moving) — this directly bounds turnover.
  - |-
    6.c) Avoid signals that primarily fire on the SAME day as a price jump; prefer
         lagged / smoothed transformations.

encouraged_families:
  # ── 基本面 / 财务质量 ───────────────────────────────────────────────────────
  - id: a
    text: "Quality persistence: rolling_mean($roe, W=60) ranked vs sector (use $sw_l1_code groupby if available; else universe rank)"
  - id: b
    text: "Valuation mean-reversion (slow, W=60/90): zscore of $pe_ttm within rolling window — captures reversion to instrument's own mean"
  - id: d
    text: "Earnings revision strength (W=20/60): $q_profit_yoy minus its rolling median over 4 quarters (shift(60)) — earnings surprise"
  - id: e
    text: "Fundamental quality combo: rank($roe) × (1 - rank(rolling_std($close_qfq.pct_change(), 20))) — low-volatility quality"
  - id: h
    text: "ROE acceleration: $roe - shift($roe, 60) / rolling_std($roe, 60) — improving earnings quality direction signal"
  - id: i
    text: "PE/ROE composite: $roe / max($pe_ttm, 0.01) — earnings yield quality; or rank(1/pe_ttm) × rank($roe)"
  # ── 资金流向 / 智能资金 ────────────────────────────────────────────────────
  - id: c
    text: "Margin financing trend (W=20/60): rolling_mean($rzye/$total_mv, 20) - rolling_mean($rzye/$total_mv, 60) — smart money net direction"
  - id: j
    text: "Short-selling pressure (W=20): $rqye / ($rzye + $rqye + 1e-9) — bearish sentiment from margin shorts"
  # ── 中长期动量 / 残差动量 ────────────────────────────────────────────────────
  - id: f
    text: "Long-horizon residual momentum (W=90/120): pct_change($close_qfq, W) minus cross-sectional mean — excludes market beta"
  - id: k
    text: "Momentum reversal combo: 12-month momentum minus 1-month (skip-1-month momentum) — standard Jegadeesh-Titman variant"
  # ── 流动性 / 微观结构 ─────────────────────────────────────────────────────
  - id: g
    text: "Liquidity stability (W=60): 1 / rolling_std($turnover_rate / rolling_mean($turnover_rate, 60), 20) — consistent liquidity"
  - id: l
    text: "Amihud illiquidity trend (W=20/60): change in rolling_mean(|pct_change($close_qfq)| / $volume, W) — improving liquidity signal"
  # ── 价格微观结构 ──────────────────────────────────────────────────────────
  - id: m
    text: "Overnight information (W=20): rolling_mean($open_qfq/shift($close_qfq) - 1, W) — after-hours information signal, absent from Alpha158"
  - id: n
    text: "Intraday amplitude trend (W=20): sign of rolling regression slope of ($high_qfq-$low_qfq)/$close_qfq over W days"

discouraged_families:
  # penalty=inf (default) → 硬黑名单. penalty=-0.5 → 软降权（可附理由尝试）
  - id: x
    text: "Short-cycle volume-price reversals on W in {5, 10} — already failed in multiple loops"
  - id: y
    text: "Same-day volume spike + price reversal patterns — extremely high turnover"
  - id: z
    text: "Anything that ranks the universe with >50% weekly turnover"
  - id: w
    text: "Factors that merely replicate Alpha158 signals (RESI5, WVMA5, CORR5/10/20, ROC60, KLEN, KLOW, VSTD5, STD5)"
    penalty: -1.0  # 软降权：如果确有新角度可尝试，但须说明为何不与 Alpha158 重叠

# 阶段 I.2：注入一段可直接 copy-adapt 的最小骨架。LLM 看到 reference 后，instrument
# MultiIndex 被 `.str.split('.')` 等破坏的概率显著下降（I.1 之后唯一的剩余阻塞）。
# 块内任何修改都要同步到 _FALLBACK_CONSTITUTION_TEXT，保持 byte-for-byte 一致。
reference_implementation: |-
  The single most common failure is rewriting the (datetime, instrument) MultiIndex.
  Use groupby(level='instrument').transform so the index is preserved intact. Do NOT
  reset_index, do NOT split/rebuild instrument strings, do NOT rename index levels.

  Instrument code format: '000001.SZ' / '600000.SH' (6-digit.EXCHANGE). NOT 'SH600000'.

      import pandas as pd

      W = 60                                       # EDIT 1: window in {5,10,20,30,60,90,120}
      df = pd.read_hdf("daily_pv.h5", key="data")  # MultiIndex (datetime, instrument)
      # Coerce all columns (some may be float32 or have NaN)
      for c in df.columns:
          df[c] = pd.to_numeric(df[c], errors="coerce")

      # Forward-fill fundamental columns first (quarterly NaN); keep the MultiIndex.
      x = df["$pe_ttm"].groupby(level="instrument").transform(lambda s: s.ffill())
      med = x.groupby(level="instrument").transform(
          lambda s: s.rolling(W, min_periods=W).median()
      )
      std = x.groupby(level="instrument").transform(
          lambda s: s.rolling(W, min_periods=W).std()
      )
      factor = (x - med) / std.replace(0, float("nan"))  # same MultiIndex, do NOT reset_index

      out = factor.to_frame("YourFactorName_%dD" % W)  # EDIT 2: factor name
      out.to_hdf("result.h5", key="data", mode="w")    # EDIT 3: nothing else

naming_convention: |-
  7) Factor names must encode type and window, e.g. QualPersist_60D, ValueMR_60D,
     MarginTrend_20D, EarnRev_4Q, LowVolQual_20D, ResidMom_60D, LiqStab_20D.
