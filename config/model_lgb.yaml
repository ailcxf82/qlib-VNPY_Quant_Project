model:
  loss: "mse"                   # qlib LGBModel 只支持 "mse" 或 "binary"，实际使用 huber 通过 params.objective 设置
  num_boost_round: 2000         # 之前1200 
  early_stopping_rounds: 100
  params:
    objective: "huber"           # 实际使用的损失函数（会覆盖 loss 参数）
    boosting_type: "gbdt"
    learning_rate: 0.015         # 之前0.05  适中，保证每棵树都有贡献   后来是0.02
    max_depth: 5                # 之前7  限制深度，避免过拟合
    num_leaves: 31             # 之前64  减少叶子节点数，让模型更专注主要特征 
    feature_fraction: 0.6     # 降低特征采样比例，增加正则化（从0.8降到0.7）
    bagging_fraction: 0.6     # 降低样本采样比例，增加正则化（从0.7降到0.6）
    bagging_freq: 1          # 之前15  增加 bagging 频率，让模型更稳定
    lambda_l1: 0.5             # 增加 L1 正则，避免过拟合（从0.2增加到0.5）
    lambda_l2: 2.0             # 增加 L2 正则，避免过拟合（从1.0增加到2.0）
    min_data_in_leaf: 60        # 之前30  保证落入每个叶子的样本足够多，统计意义才强
    verbosity: -1


